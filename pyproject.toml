[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riko-next"
version = "0.2.0"
description = "A modular, low-latency, local-first AI voice companion inspired by Project Riko"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]          # local ASR + bundled Silero VAD (onnxruntime)
local-audio = ["sounddevice>=0.4.6"]   # terminal mode (riko chat) only
all = ["faster-whisper>=1.1", "sounddevice>=0.4.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
riko = "riko.__main__:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["server"]
filterwarnings = ["ignore::DeprecationWarning"]
