# Riko Next configuration. Copy to config.yaml (start scripts do this for you).
# Paths are relative to this file. Secrets go in .env, referenced by *_env names.
# ${VAR} and ${VAR:-default} are expanded from the environment.
# Unknown keys are errors, so typos fail at startup instead of silently doing nothing.

llm:
  # ollama | lmstudio | openai | openrouter | groq | openai_compatible
  provider: ${LLM_PROVIDER:-ollama}
  model: ${LLM_MODEL:-gpt-oss:20b}   # `ollama pull gpt-oss:20b` (~13 GB). Any chat model works.
  # base_url: http://127.0.0.1:11434   # defaults per provider (LM Studio: http://127.0.0.1:1234/v1)
  # api_key_env: OPENAI_API_KEY        # defaults per provider; the key itself lives in .env
  reasoning_effort: low         # low | medium | high (gpt-oss), off (qwen3-style), null (don't send)
  temperature: 1.0              # gpt-oss recommended sampling
  max_tokens: 2048              # reasoning + answer budget; small caps starve reasoning models
  num_ctx: 8192                 # keep constant: changing it reloads the model
  safety_margin_tokens: 512
  first_content_timeout_s: 15   # no answer text by then -> short labelled fallback
  overall_timeout_s: 45
  ollama_keep_alive: 30m        # keep the model in VRAM between turns

# Optional model routing. Each role inherits everything from `llm` and overrides what you list.
# Roles with identical settings share one client (and one loaded model).
#   fast   = normal replies           smart  = follow-ups after tool calls
#   vision = describes images for the main model (unset = images are not understood)
models: {}
#  vision:
#    model: qwen3.6:latest         # any Ollama model with the "vision" capability (llava, gemma3, qwen2.5vl...)
#    reasoning_effort: off
#  smart:
#    provider: openai              # e.g. a cloud model for the harder follow-up steps
#    model: gpt-4.1-mini

tools:
  enabled: true
  max_steps: 4                  # tool rounds per reply
  # safe = time/calculator/image questions, memory = Riko's own database (memories, notes, tasks).
  # Add "network" for weather + web search and "files" for read-only access to file_roots.
  permissions: [safe, memory]
  disabled: []                  # e.g. [add_note]
  # web_search_url: http://127.0.0.1:8888   # your SearxNG instance (JSON output enabled)
  file_roots: []                # e.g. [~/Documents/notes]  (secrets like .env/*.pem are always refused)

proactive:
  enabled: true
  notification_level: normal    # off | minimal (greeting + your reminders) | normal (+ rare idle nudges)
  greeting: true
  idle_nudge_s: 90              # 0 disables nudges
  nudge_cooldown_s: 600
  max_nudges_per_session: 2
  # quiet_hours: "22:30-07:30"  # no greetings/nudges then (reminders you set still fire)
  # timezone: Asia/Kolkata      # default: this computer's local time

asr:
  provider: faster_whisper      # faster_whisper | groq | openai_compatible
  model: base.en                # tiny.en/base.en (fast, CPU ok) ... small/medium/large-v3/distil-large-v3 (GPU)
  device: auto                  # auto | cpu | cuda  (auto falls back to CPU if CUDA libs are missing)
  compute_type: auto            # auto = float16 on GPU, int8 on CPU
  language: en                  # null = auto-detect (slower)
  beam_size: 1                  # 1 = lowest latency
  initial_prompt: "Riko"        # biases recognition toward the name (and other words you put here)

audio:
  input_mode: auto              # auto (voice detection) | ptt (push-to-talk)
  vad:
    engine: silero              # silero (bundled with faster-whisper) | energy
    threshold: 0.5
    min_speech_ms: 200
    silence_ms: 650             # how long you pause before Riko answers
    preroll_ms: 300
  barge_in:
    enabled: true               # talk over Riko to interrupt her
    min_speech_ms: 350          # speech needed to count as an interruption
    duck_volume: 0.25           # her volume while deciding whether you interrupted

tts:
  provider: gpt_sovits          # gpt_sovits | openai_compatible | browser | none
  voice: riko
  max_spoken_sentences: 3       # for replies to voice; the rest is shown on screen (0 = unlimited)
  max_spoken_words: 90
  fallback: browser             # if GPT-SoVITS isn't running: browser voice (or none = text only)
  voices:
    riko:
      ref_audio: characters/voices/riko_sample.wav   # 3-10 s clip, from the original Project Riko
      prompt_text: This is a sample voice for you to just get started with because it sounds kind of cute but just make sure this doesn't have long silences.
      prompt_lang: en
      voice_id: af_heart        # used only by openai_compatible TTS (e.g. Kokoro-FastAPI)
      emotions:                 # optional per-emotion reference clips / speed
        excited: { speed_factor: 1.1 }
        sad: { speed_factor: 0.92 }
        # happy: { ref_audio: characters/voices/riko_happy.wav, prompt_text: "exact words in that clip" }
  gpt_sovits:
    base_url: ${TTS_URL:-http://127.0.0.1:9880}
    text_lang: en
    streaming_mode: 2           # 0 off, 1 best quality, 2 balanced, 3 fastest
  openai_compatible:
    base_url: http://127.0.0.1:8880/v1   # Kokoro-FastAPI default; or https://api.openai.com/v1
    # api_key_env: OPENAI_API_KEY
    model: kokoro
    sample_rate: 24000

memory:
  enabled: true
  db_path: ${DATABASE_PATH:-data/riko.db}
  embeddings:
    provider: hash              # hash (offline, keyword-level) | ollama | openai_compatible
    # provider: ollama          # recommended for real semantic recall:
    # model: nomic-embed-text   #   ollama pull nomic-embed-text, then: riko memory reindex
  top_k: 6
  extraction: llm               # llm | heuristic | off
  short_term_messages: 16
  half_life_days: { episodic: 21, semantic: 180, relationship: 365, task: 30, working: 2 }
  familiarity: { stage1_after_sessions: 1, stage2_min_days: 7, stage2_min_sessions: 6, session_gap_minutes: 30 }

personality:
  character: riko               # file in characters/
  preset: default               # default | classic (original Project Riko prompt) | friendly | sarcastic | professional

emotion:
  enabled: true
  mode: tags                    # tags (zero-latency, from the LLM) | lexicon
  mood_enabled: true            # slow-moving mood that decays back to the character's baseline
  mood_half_life_minutes: 20

server:
  host: 127.0.0.1               # keep local unless you set RIKO_AUTH_TOKEN
  port: 8765

frontend:
  show_token_stream: true
  avatar:
    enabled: true
    vrm_url: ""                 # e.g. avatars/riko.vrm (put the file in client/web/avatars/)

logging:
  level: INFO
  format: pretty                # pretty | json
  # file: data/riko.log
